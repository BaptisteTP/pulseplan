<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Energy Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Internal Ring -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Background Cardio Wave (Subtle Atmosphere) -->
  <path d="M 40 256 H 140 L 175 220 L 210 290 L 250 160 L 295 340 L 330 220 L 360 270 L 385 256 H 472" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        stroke-opacity="0.15"/>

  <!-- Main Athletic Pulse Heartbeat & Peak Line -->
  <path d="M 50 256 H 135 L 175 195 L 215 315 L 260 115 L 315 395 L 360 215 L 395 285 L 425 256 H 462" 
        fill="none" 
        stroke="url(#lineGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Energy Apex Beacon Points -->
  <circle cx="260" cy="115" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="315" cy="395" r="11" fill="#34d399" filter="url(#glow)"/>
</svg>